<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjuman | ترجمان</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f3f6fa;
    color: #17212b;
}

header {
    background: #1769aa;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    opacity: .9;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

select, button {
    border: 1px solid #ccd6df;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    background: white;
    cursor: pointer;
}

button {
    background: #1769aa;
    color: white;
    border: none;
}

button:hover {
    opacity: .9;
}

.translation-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.box {
    background: white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.07);
}

.box h3 {
    margin-top: 0;
}

textarea {
    width: 100%;
    height: 300px;
    resize: vertical;
    border: 1px solid #d5dde5;
    border-radius: 10px;
    padding: 15px;
    font-size: 18px;
    outline: none;
}

textarea:focus {
    border-color: #1769aa;
}

.output {
    min-height: 300px;
    border: 1px solid #d5dde5;
    border-radius: 10px;
    padding: 15px;
    font-size: 18px;
    white-space: pre-wrap;
    background: #fafafa;
}

.actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.status {
    margin-top: 15px;
    padding: 12px;
    background: #eef5fb;
    border-radius: 10px;
}

footer {
    text-align: center;
    margin: 40px 0;
    color: #687684;
}

@media (max-width: 700px) {
    .translation-box {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>ترجمان</h1>
    <p>Tarjuman — مترجمك الذكي</p>
</header>

<div class="container">

    <div class="toolbar">

        <select id="fromLanguage">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="tr">Türkçe</option>
        </select>

        <button onclick="swapLanguages()">⇄ تبديل اللغات</button>

        <select id="toLanguage">
            <option value="en">English</option>
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
            <option value="tr">Türkçe</option>
        </select>

    </div>

    <div class="translation-box">

        <div class="box">
            <h3>النص الأصلي</h3>

            <textarea id="sourceText"
                placeholder="اكتب النص الذي تريد ترجمته هنا..."></textarea>

            <div class="actions">
                <button onclick="translateText()">ترجمة</button>
                <button onclick="clearText()">مسح</button>
            </div>
        </div>

        <div class="box">
            <h3>الترجمة</h3>

            <div id="translatedText" class="output">
                ستظهر الترجمة هنا...
            </div>

            <div class="actions">
                <button onclick="copyTranslation()">نسخ الترجمة</button>
            </div>
        </div>

    </div>

    <div id="status" class="status">
        الحالة: جاهز
    </div>

</div>

<footer>
    Tarjuman © 2026
</footer>

<script>

function translateText() {

    const text =
        document.getElementById("sourceText").value.trim();

    const from =
        document.getElementById("fromLanguage").value;

    const to =
        document.getElementById("toLanguage").value;

    const output =
        document.getElementById("translatedText");

    const status =
        document.getElementById("status");

    if (!text) {
        output.textContent = "اكتب نصًا أولًا.";
        return;
    }

    /*
      هذه نسخة الواجهة الأولى.
      سنضع محرك الترجمة الحقيقي في المرحلة التالية.
    */

    output.textContent =
        "تم استلام النص.\n\n" +
        "محرك الترجمة المحلي سيتم ربطه هنا.";

    status.textContent =
        "الحالة: جاهز — " +
        from.toUpperCase() +
        " → " +
        to.toUpperCase();
}

function copyTranslation() {

    const text =
        document.getElementById("translatedText").textContent;

    navigator.clipboard.writeText(text);

    document.getElementById("status").textContent =
        "الحالة: تم نسخ الترجمة";
}

function clearText() {

    document.getElementById("sourceText").value = "";

    document.getElementById("translatedText").textContent =
        "ستظهر الترجمة هنا...";

    document.getElementById("status").textContent =
        "الحالة: جاهز";
}

function swapLanguages() {

    const from =
        document.getElementById("fromLanguage");

    const to =
        document.getElementById("toLanguage");

    const temp = from.value;

    from.value = to.value;
    to.value = temp;
}

</script>

</body>
</html>
